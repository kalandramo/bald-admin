# 目标目录树的构建入口（bald gen app 生成）。
version: "3"

tasks:
  proto:
    desc: 生成 protobuf 代码（插件与输出见 api/buf.gen.yaml）
    dir: api
    cmds:
      - buf generate
  run:
    desc: 本地运行（默认读 configs/bald-admin.yaml）
    cmds:
      - go run ./cmd/bald-admin
  verify:
    desc: 构建 + vet + 测试（layering 不变量含在内）
    cmds:
      - go build ./...
      - go vet ./...
      - go test ./...
