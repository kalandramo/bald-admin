            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Position'
        BatchCreatePositionsResponse:
            type: object
            properties:
                created:
                    type: array
                    items:
                        type: string
                failed:
                    type: array
                    items:
                        type: string
        CountLanguagesResponse:
            type: object
            properties:
                count:
                    type: integer
                    format: uint32
        CountOrgUnitsResponse:
            type: object
            properties:
                total:
                    type: integer
                    format: uint32
        CountPositionsResponse:
            type: object
            properties:
                total:
                    type: integer
                    format: uint32
        CreateDictEntryRequest:
