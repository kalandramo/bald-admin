tags:
    - name: AuditService
      description: "AuditService 审计日志查询服务（T6，自 go-wind-admin audit 域精简移植）。\r\n\r\n 只读查询：审计事件由写路径自动落库（gin/gRPC 拦截器链 → category=operation；\r\n 登录动作 → category=login），本服务不提供写入（源 Create rpc 是内部补录口，\r\n 精简省略——伪造审计记录违背审计不可抵赖语义）。\r\n\r\n 数据来自 AuditRecord 单表（源 Operation/LoginAuditLog 双表 + Category 分类\r\n 精简合并）；P9 归一化对象 \"audit\"（REST /v1/audit 与 gRPC AuditService 同源）。"
    - name: DictEntryService
      description: |-
        DictEntryService 字典项管理。条目挂在类型下（type_code 引用），业务键
         "<type_code>:<entry_value>"；ListEntries 是 Cache-Aside 的消费点。
    - name: DictTypeService
      description: |-
        DictTypeService 字典类型管理（T4，自 go-wind-admin dict 域 sys_dict_types 精简移植）。

         字典是租户级业务数据（源 mixin TenantID）：查询自动经 P8 隔离，ListEntries 的
         Cache-Aside 键含租户维度（dict biz）。type_code 即主键（源 immutable），仅
         展示属性可更新；删除类型级联删除其全部条目并失效对应缓存。
    - name: FileService
      description: "FileService 文件管理服务（T5，自 go-wind-admin storage 域精简移植）。\r\n\r\n 文件是租户级业务数据（源 mixin TenantID）：查询自动经 P8 隔离。上传校验\r\n 大小上限（50MiB）与 MIME 白名单（源 pkg/oss 语义），对象按内容类型分桶并\r\n 兜底创建桶；元数据含 SHA256 内容哈希与长度。上传/下载为二进制流：gateway\r\n 转码（bytes→base64 JSON）可用，推荐经 gin 主服务的 multipart/流式 REST。"
    - name: MenuService
      description: |-
        MenuService 菜单管理服务（T3，自 go-wind-admin permission 域 sys_menus 精简移植）。

         菜单是前端导航树的数据源（自引用树，parent_id），同时是权限点可见性的挂载面
         （Permission.MenuIDs）。管理面操作仅授予 admin 角色（casbin 策略数据化装载）。
    - name: PermissionService
      description: |-
        PermissionService 权限管理服务（T3，自 go-wind-admin permission 域精简移植）。

         两块职责：
           1. 权限点注册表（Permission）：权限码 → 名称/菜单可见性关联
              （源 sys_permissions + sys_permission_menus 精简——关联内联为 MenuIDs CSV）；
           2. 角色策略（RolePolicy）：casbin p 行（role,object,action）的数据化持久层，
              替代 M6.1 的静态 rbac_policy.csv（D3 策略数据化装载，重启生效）。
         管理面操作仅授予 admin 角色（策略本身也数据化于 RolePolicy 表）。
    - name: SecretService
      description: |-
        SecretService 受限资源服务（M5：经 grpc-gateway 同时暴露 gRPC 与 REST）。

         T2 起 proto 全部收敛到 api/ 目录（buf 模块根=api/）；本文件的 ListUsers 演示 RPC
         已由 UserService.ListUsers（api/user/v1）接管 GET /v1/users（对象列表版本）。
    - name: TenantService
      description: |-
        TenantService 租户管理服务（T2，自 go-wind-admin identity/tenant.proto 精简搬运）。

         双层语义（移植计划 §6 D2）：
           1. 业务层——本服务管理租户本身（租户即业务实体，对应源 sys_tenants；
              platform 为平台租户，对应源 PlatformTenantID=0）；
           2. 框架层——bald P8 pkg/store 对其他业务表（users/secrets/…）自动注入
              tenant_id 读过滤与写注入，与本服务无关。
         租户管理是平台侧操作：REST/gRPC 路由仅授予 platform:admin 角色（casbin 策略）。
    - name: UserService
      description: |-
        UserService 用户管理服务（T2，自 go-wind-admin identity/user.proto + user_profile.proto
         精简搬运）。列表/读写天然按当前租户过滤（bald P8 pkg/store 自动注入 tenant_id），
         跨租户用户不可见（隔离验证点）。

         注意：原 SecretService.ListUsers（string 列表演示 RPC，M3）自本版本起由本服务
         ListUsers 接管 GET /v1/users（对象列表，语义延续且增强），避免 gateway 路由重复注册。
