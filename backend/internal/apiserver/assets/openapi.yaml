components:
    schemas:
        AuditRecord:
            type: object
            properties:
                id:
                    type: string
                tenant_id:
                    type: string
                category:
                    type: string
                subject:
                    type: string
                object:
                    type: string
                action:
                    type: string
                result:
                    type: string
                error:
                    type: string
                ip_address:
                    type: string
                user_agent:
                    type: string
                request_id:
                    type: string
                trace_id:
                    type: string
                http_method:
                    type: string
                    description: '---- api 类专属 ----'
                path:
                    type: string
                status_code:
                    type: integer
                    format: uint32
                latency_ms:
                    type: integer
                    format: uint32
                table_name:
                    type: string
                    description: '---- data_access 类专属 ----'
                data_source:
                    type: string
                db_user:
                    type: string
                sql_text:
                    type: string
                affected_rows:
                    type: integer
                    format: uint32
                target_type:
                    type: string
                    description: '---- permission 类专属 ----'
                target_id:
                    type: string
                old_value:
                    type: string
                new_value:
                    type: string
                session_id:
                    type: string
                    description: '---- login 类专属 ----'
                mfa_status:
                    type: string
                time:
                    type: string
                    format: date-time
            description: |-
                AuditRecord 审计日志条目。字段对齐 model.AuditRecord
                 （Success 由 Result 推导，LogHash/Signature 合规链后续迭代）。

                 单表 + category 承载**五类**审计（operation/login/api/
                 data_access/permission）。五类字段差异大，此处取并集为
                 nullable 列（决策记录见 e2e 文件头）——api/data_access/permission
                 三类专属字段列在下方分组。
        BatchCreateLanguagesRequest:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Language'
        BatchCreateLanguagesResponse:
            type: object
            properties:
                created_ids:
                    type: array
                    items:
                        type: string
        BatchCreateOrgUnitsRequest:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/OrgUnit'
        BatchCreateOrgUnitsResponse:
