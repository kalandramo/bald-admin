    /v1/org-units/{parent_id}/children:
        get:
            tags:
                - OrgUnitService
            description: |-
                ListOrgUnitChildren 列出某节点的**直接子节点**（分页，不递归）。
                 用于 el-table 懒加载：展开节点时按需拉取其下一层。
                   REST: GET /v1/org-units/{parent_id}/children
            operationId: OrgUnitService_ListOrgUnitChildren
            parameters:
                - name: parent_id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: paging.page
                  in: query
                  description: 当前页码（从1开始，默认1）
                  schema:
                    type: integer
                    format: uint32
                - name: paging.page_size
                  in: query
                  description: 每页条数（默认10，建议设置上限如100）
                  schema:
                    type: integer
                    format: uint32
                - name: paging.offset
                  in: query
                  description: 跳过的记录数（从0开始，默认0）
                  schema:
                    type: string
                - name: paging.limit
                  in: query
                  description: 最多返回的记录数（默认10，建议设置上限如100）
                  schema:
                    type: integer
                    format: uint32
                - name: paging.token
                  in: query
                  description: 上一页最后一条记录的游标（如ID/时间戳+ID，首次请求为空）
                  schema:
                    type: string
                - name: paging.no_paging
                  in: query
                  description: 是否不分页，如果为true，则page和pageSize参数无效。
                  schema:
                    type: boolean
                - name: paging.query
                  in: query
                  description: JSON字符串过滤条件，基础语法：{"field1":"val1", "field2___icontains":"val2"}。
                  schema:
                    type: string
                - name: paging.filter
                  in: query
                  description: Google AIP规范字符串过滤条件。
                  schema:
                    type: string
                - name: paging.filter_expr.type
                  in: query
                  description: 过滤表达式类型
                  schema:
                    enum:
                        - EXPR_TYPE_UNSPECIFIED
                        - AND
                        - OR
                    type: string
                    format: enum
                - name: paging.order_by
                  in: query
                  description: 排序条件（"val1,-val2" 风格，- 前缀表示降序；与 sorting 二选一）
                  schema:
                    type: string
                - name: paging.field_mask
                  in: query
                  description: |-
                    字段掩码，其作用为SELECT中的字段，其语法为使用逗号分隔字段名，例如：id,realName,userName。
                     如果为空则选中所有字段，即SELECT *。
                  schema:
                    type: string
                    format: field-mask
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListOrgUnitChildrenResponse'
