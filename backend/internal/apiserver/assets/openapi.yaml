components:
    schemas:
        AuditRecord:
            type: object
            properties:
                id:
                    type: string
                tenant_id:
                    type: string
                category:
                    type: string
                subject:
                    type: string
                object:
                    type: string
                action:
                    type: string
                result:
                    type: string
                error:
                    type: string
                ip_address:
                    type: string
                user_agent:
                    type: string
                request_id:
                    type: string
                trace_id:
                    type: string
                http_method:
                    type: string
                    description: '---- api 类专属（源 ApiAuditLog）----'
                path:
                    type: string
                status_code:
                    type: integer
                    format: uint32
                latency_ms:
                    type: integer
                    format: uint32
                table_name:
                    type: string
                    description: '---- data_access 类专属（源 DataAccessAuditLog）----'
                data_source:
                    type: string
                db_user:
                    type: string
                sql_text:
                    type: string
                affected_rows:
                    type: integer
                    format: uint32
                target_type:
                    type: string
                    description: '---- permission 类专属（源 PermissionAuditLog）----'
                target_id:
                    type: string
                old_value:
                    type: string
                new_value:
                    type: string
                session_id:
                    type: string
                    description: '---- login 类专属（源 LoginAuditLog）----'
                mfa_status:
                    type: string
                time:
                    type: string
                    format: date-time
            description: "AuditRecord 审计日志条目。字段对齐 model.AuditRecord（源\r\n OperationAuditLog/LoginAuditLog 共有核心字段精简；\r\n Success 由 Result 推导，LogHash/Signature 合规链后续迭代）。\r\n\r\n Wave 5.1：单表 + category 承载源**五类**审计（operation/login/api/\r\n data_access/permission）。源是五张独立表、字段差异大，此处取并集为\r\n nullable 列（决策记录见 e2e 文件头）——api/data_access/permission\r\n 三类专属字段列在下方分组。"
        BatchCreateLanguagesRequest:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Language'
