tags:
    - name: AdminPortalService
      description: "AdminPortalService 后台前端初始化数据与配置服务（Wave 6.2，自 go-wind-admin\r\n admin 域 i_admin_portal.proto 精简移植，3 rpc）。\r\n\r\n ## 为何是真新增（裁定见计划 §Wave 6.1）\r\n\r\n 本 service **不 import** 其他业务域的消息类型（源仅 import menu.proto 作\r\n MenuRouteItem 复用）——三个 rpc 全是**跨域聚合**：把 user/role/permission/menu\r\n 四域的数据拼成前端初始化所需的视图，无单一对标 biz。\r\n\r\n ## 聚合链（源 admin_portal_service.go 实测）\r\n\r\n\tUser.Roles(角色名) → Role.Perms(权限码) → Permission.MenuIDs(菜单ID) → Menu 树\r\n\r\n 即「当前登录用户 → 其角色 → 角色权限码 → 权限点关联的菜单 → 过滤出路由」。\r\n\r\n ## 与源的差异\r\n\r\n 源的 `MenuRouteItem` 复用 permission 域消息（含 meta 嵌套对象）；本项目 Menu\r\n model 已内联 Title/Icon/Order（见 model/menu.go），故 MenuRouteItem 在本域\r\n 重新定义为扁平结构。源的套餐模块白名单过滤（filterMenusByPlanWhitelist）\r\n 未移植——本项目 plan_module 的 module 字段语义未对齐（源用枚举，本项目\r\n 未落该字段），强行实现会造无数据来源的逻辑。"
    - name: AuditService
      description: "AuditService 审计日志查询服务（T6，自 go-wind-admin audit 域精简移植）。\r\n\r\n 只读查询：审计事件由写路径自动落库（gin/gRPC 拦截器链 → category=operation；\r\n 登录动作 → category=login），本服务不提供写入（源 Create rpc 是内部补录口，\r\n 精简省略——伪造审计记录违背审计不可抵赖语义）。\r\n\r\n 数据来自 AuditRecord 单表（源 Operation/LoginAuditLog 双表 + Category 分类\r\n 精简合并）；P9 归一化对象 \"audit\"（REST /v1/audit 与 gRPC AuditService 同源）。"
    - name: DictEntryService
      description: |-
        DictEntryService 字典项管理。条目挂在类型下（type_code 引用），业务键
         "<type_code>:<entry_value>"；ListEntries 是 Cache-Aside 的消费点。
    - name: DictTypeService
      description: |-
        DictTypeService 字典类型管理（T4，自 go-wind-admin dict 域 sys_dict_types 精简移植）。

         字典是租户级业务数据（源 mixin TenantID）：查询自动经 P8 隔离，ListEntries 的
         Cache-Aside 键含租户维度（dict biz）。type_code 即主键（源 immutable），仅
         展示属性可更新；删除类型级联删除其全部条目并失效对应缓存。
    - name: FileService
      description: "FileService 文件管理服务（T5，自 go-wind-admin storage 域精简移植）。\r\n\r\n 文件是租户级业务数据（源 mixin TenantID）：查询自动经 P8 隔离。上传校验\r\n 大小上限（50MiB）与 MIME 白名单（源 pkg/oss 语义），对象按内容类型分桶并\r\n 兜底创建桶；元数据含 SHA256 内容哈希与长度。上传/下载为二进制流：gateway\r\n 转码（bytes→base64 JSON）可用，推荐经 gin 主服务的 multipart/流式 REST。"
    - name: LanguageService
      description: "LanguageService 语言管理（Wave 5.3，自 go-wind-admin dict 域 language 精简移植）。\r\n\r\n 源语言域 7 rpc（List/Count/Get/Create/BatchCreate/Update/Delete）。本实现\r\n **对齐项目既有惯例**（与同目录 DictType/DictEntry 一致），与源有两处显式偏差：\r\n\r\n  1. **主键用 string 业务键**（`language_code`，如 \"zh-CN\"）而非源 `uint32 id`\r\n     ——源 ID 由 DB 自增生成，本项目 dict 域同款场景（type_code 作主键）已确立\r\n     「业务键主键」范式（见 model/dict.go），语言代码天然唯一且可读。\r\n  2. **请求体简化**：源的 `FieldMask view_mask`/`update_mask`/`oneof query_by`\r\n     未移植——本项目 handler 用「非空字段即更新」语义（同 DictType 的 Update），\r\n     字段掩码是源框架的通用能力，复刻它对功能对等无增益。\r\n\r\n BatchCreate 源 service 层**未实现**（proto 有、`language_service.go` 无该方法）\r\n ——故本实现同样返回 UNIMPLEMENTED（对齐源行为，不自创）。"
    - name: MenuService
      description: |-
        MenuService 菜单管理服务（T3，自 go-wind-admin permission 域 sys_menus 精简移植）。

         菜单是前端导航树的数据源（自引用树，parent_id），同时是权限点可见性的挂载面
         （Permission.MenuIDs）。管理面操作仅授予 admin 角色（casbin 策略数据化装载）。
    - name: OrgUnitService
      description: "OrgUnitService 组织单元管理（Wave P0.5，自 go-wind-admin identity 域\r\n org_unit.proto 精简移植，源 7 rpc：List/Count/Get/Create/Update/Delete/BatchCreate）。\r\n\r\n 本实现**对齐项目既有惯例**（与 dict/menu/tenant 一致），与源有多处显式偏差：\r\n\r\n  1. **主键用 string 业务键**（`code`，如 \"FIN-LEADER-001\"）而非源 `uint32 id`\r\n     ——源 ID 由 DB 自增生成；本项目 model.OrgUnit 主键即 `\"<tenant>:<code>\"`\r\n     （见 internal/apiserver/model/org.go），code 是跨系统同步的稳定标识。\r\n     proto 的 `id` 字段保留为**只读输出**（完整主键），供前端判断编辑态。\r\n  2. **请求体简化**：源的 `oneof query_by` / `FieldMask view_mask` /\r\n     `update_mask` / `allow_missing` 未移植——本项目 handler 用「非空字段即更新」\r\n     语义，并用 `*_set` 显式位区分「未设置」与「设为零值」（见 UpdateOrgUnitRequest）。\r\n  3. **枚举加前缀 + 补 0 值**：源 `Status{OFF=0,ON=1}` 的 0 值语义为「禁用」，\r\n     但 proto3 的 0 值必须是默认值——本实现改 `STATUS_UNSPECIFIED=0`（同 menu/tenant）。\r\n  4. **`parent_id` 语义统一为「父节点 code」**：源 model 存完整主键、对外暴露\r\n     也是完整主键（输入 code 输出主键，语义不对称）；本实现输入输出统一为 code。\r\n  5. **不移植源的分页**：源 List 用 `pagination.PagingRequest`；本实现精简为全量\r\n     （同 menu.proto 的 ListMenusRequest），分页列入后续迭代。\r\n  6. **不移植** gnostic 注解 / `attributes` map / `business_scopes` /\r\n     `permission_tags` / 法务与地理字段（源 40 字段 → 本实现 14 字段）：\r\n     以本项目 model.OrgUnit 的实际字段集为准（用户要求「对齐本项目字段」）。"
    - name: PermissionService
      description: |-
        PermissionService 权限管理服务（T3，自 go-wind-admin permission 域精简移植）。

         两块职责：
           1. 权限点注册表（Permission）：权限码 → 名称/菜单可见性关联
              （源 sys_permissions + sys_permission_menus 精简——关联内联为 MenuIDs CSV）；
           2. 角色策略（RolePolicy）：casbin p 行（role,object,action）的数据化持久层，
              替代 M6.1 的静态 rbac_policy.csv（D3 策略数据化装载，重启生效）。
         管理面操作仅授予 admin 角色（策略本身也数据化于 RolePolicy 表）。
    - name: PositionService
      description: "PositionService 职位管理（Wave P0.5，自 go-wind-admin identity 域\r\n position.proto 精简移植，源 7 rpc：List/Count/Get/Create/Update/Delete/BatchCreate）。\r\n\r\n 与 OrgUnitService 同域的显式偏差（主键 string 业务键 / 请求体简化 /\r\n 枚举加前缀 / 不移植分页与 gnostic 注解）见 org_unit.proto 头注，此处不重复。\r\n\r\n 额外两点：\r\n  1. **关联字段回填**：`org_unit_name` / `reports_to_position_name` 由服务端\r\n     批量查询回填（源 org_unit_service.go 的三步式：extractRelationIDs →\r\n     fetchRelationInfo 批量查 → bindRelations 递归回填）。**批量**是源的精髓，\r\n     逐个查会退化成 N+1。\r\n  2. **源枚举注释有误**：源 `position.proto` 的 `OFF = 0; // 打开` 与\r\n     `ON = 1; // 关闭` 注释与枚举名语义相反（源缺陷）；本实现按名称语义修正。"
    - name: RedisCacheMonitorService
      description: "RedisCacheMonitorService Redis 缓存监控（只读，聚合 INFO/DBSIZE/SLOWLOG 视图）。\r\n\r\n Wave 6.2 真新增（裁定见计划 §Wave 6.1）：源 redis_cache 域仅此 1 rpc，无对标 biz。\r\n\r\n ## fail-soft 语义（对齐源 redis_cache_monitor_repo.go）\r\n\r\n 三个只读命令（INFO / DBSIZE / SLOWLOG GET）**任一失败不阻断其余**——失败项\r\n 置空并记日志，而非整体报错。Redis 不可用时返回**空视图**（非错误），避免\r\n 单点故障导致整个监控页不可用。"
    - name: SecretService
      description: |-
        SecretService 受限资源服务（M5：经 grpc-gateway 同时暴露 gRPC 与 REST）。

         T2 起 proto 全部收敛到 api/ 目录（buf 模块根=api/）；本文件的 ListUsers 演示 RPC
         已由 UserService.ListUsers（api/user/v1）接管 GET /v1/users（对象列表版本）。
    - name: TenantService
      description: |-
        TenantService 租户管理服务（T2，自 go-wind-admin identity/tenant.proto 精简搬运）。

         双层语义（移植计划 §6 D2）：
           1. 业务层——本服务管理租户本身（租户即业务实体，对应源 sys_tenants；
              platform 为平台租户，对应源 PlatformTenantID=0）；
           2. 框架层——bald P8 pkg/store 对其他业务表（users/secrets/…）自动注入
              tenant_id 读过滤与写注入，与本服务无关。
         租户管理是平台侧操作：REST/gRPC 路由仅授予 platform:admin 角色（casbin 策略）。
    - name: UserService
      description: |-
        UserService 用户管理服务（T2，自 go-wind-admin identity/user.proto + user_profile.proto
         精简搬运）。列表/读写天然按当前租户过滤（bald P8 pkg/store 自动注入 tenant_id），
         跨租户用户不可见（隔离验证点）。

         注意：原 SecretService.ListUsers（string 列表演示 RPC，M3）自本版本起由本服务
         ListUsers 接管 GET /v1/users（对象列表，语义延续且增强），避免 gateway 路由重复注册。
