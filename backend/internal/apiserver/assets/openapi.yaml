                        - TYPE_UNSPECIFIED
                        - TYPE_COMPANY
                        - TYPE_DIVISION
                        - TYPE_DEPARTMENT
                        - TYPE_TEAM
                        - TYPE_PROJECT
                        - TYPE_COMMITTEE
                        - TYPE_REGION
                        - TYPE_SUBSIDIARY
                        - TYPE_BRANCH
                        - TYPE_OTHER
                    type: string
                    format: enum
                parent_id:
                    type: string
                status:
                    enum:
                        - STATUS_UNSPECIFIED
                        - STATUS_ON
                        - STATUS_OFF
                    type: string
                    format: enum
                sort_order:
                    type: integer
                    format: int32
                sort_order_set:
                    type: boolean
                leader_id:
                    type: string
                remark:
                    type: string
                description:
                    type: string
            description: |-
                UpdateOrgUnitRequest 更新组织单元入参。

                 **校验语义与 Create 的关键差异**：更新采用「非空字段即更新」语义，name 为空
                 表示「不改」——故 name **只加 max_len、不加 min_len**（加 min_len 会把
                 「只改其他字段、不传 name」这种正常操作误判为非法）。code 是路径参数定位，
                 同样不强制非空（路由保证非空段）。
        UpdateOrgUnitResponse:
            type: object
            properties:
                org_unit:
                    $ref: '#/components/schemas/OrgUnit'
        UpdatePermissionRequest:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                menu_ids:
                    type: array
                    items:
                        type: string
                menu_ids_set:
                    type: boolean
                remark:
                    type: string
        UpdatePermissionResponse:
            type: object
            properties:
                permission:
                    $ref: '#/components/schemas/Permission'
        UpdatePositionRequest:
            type: object
            properties:
                code:
                    type: string
                name:
                    type: string
                headcount:
                    type: integer
                    format: int32
                headcount_set:
                    type: boolean
                sort_order:
                    type: integer
                    format: int32
                sort_order_set:
                    type: boolean
                status:
                    enum:
                        - STATUS_UNSPECIFIED
                        - STATUS_ON
                        - STATUS_OFF
                    type: string
                    format: enum
                type:
                    enum:
                        - TYPE_UNSPECIFIED
                        - TYPE_REGULAR
                        - TYPE_LEADER
                        - TYPE_MANAGER
                        - TYPE_INTERN
                        - TYPE_CONTRACT
                        - TYPE_OTHER
                    type: string
                    format: enum
                remark:
                    type: string
                description:
                    type: string
                job_family:
                    type: string
                job_grade:
                    type: string
                level:
                    type: integer
                    format: int32
                level_set:
                    type: boolean
                is_key_position:
                    type: boolean
                is_key_position_set:
                    type: boolean
                org_unit_id:
                    type: string
                reports_to_position_id:
                    type: string
            description: |-
                UpdatePositionRequest 更新职位入参。
                 **校验语义同 UpdateOrgUnitRequest**：name 为空 = 不改，故只加 max_len 不加 min_len。
        UpdatePositionResponse:
            type: object
            properties:
                position:
                    $ref: '#/components/schemas/Position'
        UpdateTenantRequest:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                status:
                    enum:
                        - STATUS_UNSPECIFIED
                        - STATUS_ON
                        - STATUS_OFF
                        - STATUS_FREEZE
                    type: string
                    format: enum
                remark:
                    type: string
        UpdateTenantResponse:
            type: object
            properties:
                tenant:
                    $ref: '#/components/schemas/Tenant'
        UpdateUserRequest:
            type: object
            properties:
                id:
                    type: string
                username:
                    type: string
                roles:
                    type: array
                    items:
                        type: string
                password:
                    type: string
        UpdateUserResponse:
            type: object
            properties:
                user:
                    $ref: '#/components/schemas/User'
        UploadFileRequest:
            type: object
            properties:
                file_name:
                    type: string
                file_directory:
                    type: string
                content:
                    type: string
                    format: bytes
        UploadFileResponse:
            type: object
            properties:
                file:
                    $ref: '#/components/schemas/File'
        User:
            type: object
            properties:
                id:
                    type: string
                username:
                    type: string
                roles:
                    type: array
                    items:
                        type: string
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
            description: |-
                User 用户。ID 为业务编码（如 "u-admin"）；tenant_id 不在此消息中——
                 由 store 层从上下文注入（写）与过滤（读），客户端不可指定。
tags:
    - name: AdminPortalService
      description: |-
        AdminPortalService 后台前端初始化数据与配置服务（3 个 rpc）。

         本 service **不 import** 其他业务域的消息类型——三个 rpc 全是**跨域聚合**：
         把 user/role/permission/menu 四域的数据拼成前端初始化所需的视图，无单一对标 biz。

         ## 聚合链

        	User.Roles(角色名) → Role.Perms(权限码) → Permission.MenuIDs(菜单ID) → Menu 树

         即「当前登录用户 → 其角色 → 角色权限码 → 权限点关联的菜单 → 过滤出路由」。

         ## 设计说明

         `MenuRouteItem` 在本域重新定义为扁平结构（不复用 permission 域消息）：本项目
         Menu model 已内联 Title/Icon/Order（见 model/menu.go）。套餐白名单过滤未实现
         ——plan_module 的 module 字段语义未落，强行实现会造无数据来源的逻辑。
    - name: AuditService
      description: |-
        AuditService 审计日志查询服务。

         只读查询：审计事件由写路径自动落库（gin/gRPC 拦截器链 → category=operation；
         登录动作 → category=login），本服务不提供写入——伪造审计记录违背审计不可抵赖语义。

         数据来自 AuditRecord 单表（Category 分类合并）；归一化对象 "audit"
         （REST /v1/audit 与 gRPC AuditService 同源）。

         **分页与租户隔离**：List 用框架标准 `bald.store.v1.PagingRequest`
         （与 identity/org_unit.proto 一致），底层走 `Store.ListWithPaging`。由此带来一处
         **行为变更**：框架 `mergeTenant` 强制注入租户隔离（无跳过机制），故本域从
         「跨租户全量查询」改为「仅本租户可见」——多租户下消除潜在信息泄露面。
         见 biz/v1/auditlog/auditlog.go 的包注释。
    - name: DictEntryService
      description: |-
        DictEntryService 字典项管理。条目挂在类型下（type_code 引用），业务键
         "<type_code>:<entry_value>"；ListEntries 是 Cache-Aside 的消费点。
    - name: DictTypeService
      description: |-
        DictTypeService 字典类型管理。

         字典是租户级业务数据：查询自动经 store 层租户隔离，ListEntries 的
         Cache-Aside 键含租户维度（dict biz）。type_code 即主键（不可变），仅
         展示属性可更新；删除类型级联删除其全部条目并失效对应缓存。
    - name: FileService
      description: |-
        FileService 文件管理服务。

         文件是租户级业务数据：查询自动经 store 层租户隔离。上传校验
         大小上限（50MiB）与 MIME 白名单，对象按内容类型分桶并
         兜底创建桶；元数据含 SHA256 内容哈希与长度。上传/下载为二进制流：gateway
         转码（bytes→base64 JSON）可用，推荐经 gin 主服务的 multipart/流式 REST。
    - name: LanguageService
      description: |-
        LanguageService 语言管理（7 个 rpc：List/Count/Get/Create/BatchCreate/Update/Delete）。

         设计约定（与同目录 DictType/DictEntry 一致）：

          1. **主键用 string 业务键**（`language_code`，如 "zh-CN"）而非 DB 自增 ID
             ——dict 域同款场景（type_code 作主键）已确立「业务键主键」范式
             （见 model/dict.go），语言代码天然唯一且可读。
          2. **请求体简化**：不使用 `FieldMask view_mask`/`update_mask`/`oneof query_by`
             ——handler 用「非空字段即更新」语义（同 DictType 的 Update），
             字段掩码对功能对等无增益。

         BatchCreate 返回 UNIMPLEMENTED（未实现，避免自创语义）。
    - name: MenuService
      description: |-
        MenuService 菜单管理服务。

         菜单是前端导航树的数据源（自引用树，parent_id），同时是权限点可见性的挂载面
         （Permission.MenuIDs）。管理面操作仅授予 admin 角色（casbin 策略数据化装载）。
    - name: OrgUnitService
      description: |-
        OrgUnitService 组织单元管理（7 个 rpc：List/Count/Get/Create/Update/Delete/BatchCreate）。

         设计约定（与 dict/menu/tenant 一致）：

          1. **主键用 string 业务键**（`code`，如 "FIN-LEADER-001"）而非 DB 自增 ID；
             model.OrgUnit 主键即 `"<tenant>:<code>"`（见 internal/apiserver/model/org.go），
             code 是跨系统同步的稳定标识。proto 的 `id` 字段保留为**只读输出**（完整主键），
             供前端判断编辑态。
          2. **请求体简化**：不使用 `oneof query_by` / `FieldMask view_mask` /
             `update_mask` / `allow_missing`——handler 用「非空字段即更新」语义，
             并用 `*_set` 显式位区分「未设置」与「设为零值」（见 UpdateOrgUnitRequest）。
          3. **枚举加前缀 + 补 0 值**：proto3 的 0 值必须是默认值，故
             `STATUS_UNSPECIFIED=0`（同 menu/tenant）。
          4. **`parent_id` 语义统一为「父节点 code」**：输入输出都是 code，不混用主键与编码。
          5. **分页用框架自有 `bald.store.v1.PagingRequest`**（见 buf.yaml）。树形与分页语义
             冲突（分页会截断 children），故采用**根节点分页 + 子节点懒加载**：
             ListOrgUnits 只返回根节点分页，展开节点时调 ListOrgUnitChildren 拉取直接子节点。
          6. **字段集以 model.OrgUnit 实际字段为准**（14 字段）：不含 `attributes` map /
             `business_scopes` / `permission_tags` / 法务与地理字段。
    - name: PermissionService
      description: |-
        PermissionService 权限管理服务。

         两块职责：
           1. 权限点注册表（Permission）：权限码 → 名称/菜单可见性关联
              （关联内联为 MenuIDs CSV）；
           2. 角色策略（RolePolicy）：casbin p 行（role,object,action）的数据化持久层，
              重启生效（策略装载自本表）。
         管理面操作仅授予 admin 角色（策略本身也数据化于 RolePolicy 表）。
    - name: PositionService
      description: |-
        PositionService 职位管理（7 个 rpc：List/Count/Get/Create/Update/Delete/BatchCreate）。

         约定（主键 string 业务键 / 请求体简化 / 枚举加前缀 / 列表不分页）见
         org_unit.proto 头注，此处不重复。

         额外两点：
          1. **关联字段回填**：`org_unit_name` / `reports_to_position_name` 由服务端
             批量查询回填（extractRelationIDs → fetchRelationInfo → bindRelations）。
             必须**批量**，逐个查会退化成 N+1。
          2. 状态枚举按名称语义：ON=1（启用）、OFF=2（禁用），0 值留作 UNSPECIFIED。
    - name: RedisCacheMonitorService
      description: |-
        RedisCacheMonitorService Redis 缓存监控（只读，聚合 INFO/DBSIZE/SLOWLOG 视图）。

         ## fail-soft 语义

         三个只读命令（INFO / DBSIZE / SLOWLOG GET）**任一失败不阻断其余**——失败项
         置空并记日志，而非整体报错。Redis 不可用时返回**空视图**（非错误），避免
         单点故障导致整个监控页不可用。
    - name: SecretService
      description: |-
        SecretService 受限资源服务（经 grpc-gateway 同时暴露 gRPC 与 REST）。

         proto 全部收敛到 api/ 目录（buf 模块根=api/）；本文件的 ListUsers 演示 RPC
         已由 UserService.ListUsers（api/user/v1）接管 GET /v1/users（对象列表版本）。
    - name: TenantService
      description: |-
        TenantService 租户管理服务。

         双层语义：
           1. 业务层——本服务管理租户本身（租户即业务实体；
              platform 为平台租户，ID=0 等价物）；
           2. 框架层——pkg/store 对其他业务表（users/secrets/…）自动注入
              tenant_id 读过滤与写注入，与本服务无关。
         租户管理是平台侧操作：REST/gRPC 路由仅授予 platform:admin 角色（casbin 策略）。
    - name: UserService
      description: |-
        UserService 用户管理服务。列表/读写天然按当前租户过滤
         （pkg/store 自动注入 tenant_id），跨租户用户不可见。

         ListUsers 接管 GET /v1/users（对象列表），避免 gateway 路由重复注册。
