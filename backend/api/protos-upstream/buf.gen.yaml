# protos-upstream 的生成配置（D18 修复后）。
#
# 与 ../buf.gen.yaml 的关键差异：**managed.disable 必须逐个豁免所有外部依赖**。
# 根因（D18）：managed.override.go_package_prefix 会**无差别覆写所有 proto 文件**
# 的 go_package——包括来自外部 BSR 模块的文件。若不豁免，生成物会把
# `gnostic/openapi/v3` 的 import 改写成
# `github.com/kalandramo/bald-admin/api/protos-upstream/gen/go/gnostic/openapi/v3`
# （项目内不存在的路径）→ go build 失败。
#
# 本项目生产 protos/ 只引 googleapis 两项（恰在豁免内），故从未暴露；
# 本目录引 gnostic（54 处）+ pagination（55 处）才触发。
#
# 新增外部依赖时，务必同步在此追加 disable 条目。
version: v2
managed:
  enabled: true
  disable:
    # 外部依赖（逐个豁免，不可遗漏）：
    - file_option: go_package
      module: buf.build/googleapis/googleapis
    - file_option: go_package
      module: buf.build/gnostic/gnostic
    - file_option: go_package
      module: buf.build/tx7do/pagination
  override:
    # 仅作用于本 module 自己的 proto。
    - file_option: go_package_prefix
      value: github.com/kalandramo/bald-admin/api/protos-upstream/gen/go
inputs:
  - directory: .
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
