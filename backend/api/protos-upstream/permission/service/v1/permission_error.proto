syntax = "proto3";

package permission.service.v1;


// 权限系统错误定义
enum PermissionErrorReason {

  // 400
  BAD_REQUEST = 0; // 错误请求

  // 401
  UNAUTHORIZED = 100; // 未授权

  // 402
  PAYMENT_REQUIRED = 200; // 需要支付

  // 403
  FORBIDDEN = 300; // 禁止访问

  // 404
  NOT_FOUND = 400; // 找不到资源
  FILE_NOT_FOUND = 401; // 文件不存在

  // 405
  METHOD_NOT_ALLOWED = 500; // 方法不允许

  // 406
  NOT_ACCEPTABLE = 600; // 不可接受的请求

  // 407
  PROXY_AUTHENTICATION_REQUIRED = 700; // 代理身份验证需要

  // 408
  REQUEST_TIMEOUT = 800; // 请求超时

  // 409
  CONFLICT = 900;                   // 冲突

  // 410
  GONE = 1000;                       // 已删除

  // 411
  LENGTH_REQUIRED = 1010;            // 需要Content-Length

  // 412
  PRECONDITION_FAILED = 1020;        // 前置条件失败

  // 413
  PAYLOAD_TOO_LARGE = 1030;          // 负载过大
  FILE_TOO_LARGE = 1031; // 文件过大

  // 414
  URI_TOO_LONG = 1040;               // URI过长

  // 415
  UNSUPPORTED_MEDIA_TYPE = 1050;     // 不支持的媒体类型

  // 416
  RANGE_NOT_SATISFIABLE = 1060;      // 请求范围无法满足

  // 417
  EXPECTATION_FAILED = 1070;         // 期望失败

  // 418
  IM_A_TEAPOT = 1080;                // 我是茶壶 (RFC 2324)

  // 421
  MISDIRECTED_REQUEST = 1090;        // 错误的请求

  // 422
  UNPROCESSABLE_ENTITY = 1100;       // 不可处理的实体

  // 423
  LOCKED = 1110;                     // 已锁定

  // 424
  FAILED_DEPENDENCY = 1120;          // 依赖失败

  // 425
  TOO_EARLY = 1130;                  // 请求过早

  // 426
  UPGRADE_REQUIRED = 1140;           // 需要升级

  // 428
  PRECONDITION_REQUIRED = 1150;      // 需要前置条件

  // 429
  TOO_MANY_REQUESTS = 1160;          // 请求过多

  // 431
  REQUEST_HEADER_FIELDS_TOO_LARGE = 1170; // 请求头字段过大

  // 451
  UNAVAILABLE_FOR_LEGAL_REASONS = 1180; // 因法律原因不可用


  // 500
  INTERNAL_SERVER_ERROR = 2000;        // 内部服务器错误
  UPLOAD_FAILED = 2001;
  DOWNLOAD_FAILED = 2002;

  // 501
  NOT_IMPLEMENTED = 2100;              // 未实现

  // 502
  BAD_GATEWAY = 2200;                  // 错误网关

  // 503
  SERVICE_UNAVAILABLE = 2300;          // 服务不可用

  // 504
  GATEWAY_TIMEOUT = 2400;              // 网关超时

  // 505
  HTTP_VERSION_NOT_SUPPORTED = 2500;   // HTTP版本不支持

  // 506
  VARIANT_ALSO_NEGOTIATES = 2600;      // 变体也协商

  // 507
  INSUFFICIENT_STORAGE = 2700;         // 存储空间不足

  // 508
  LOOP_DETECTED = 2800;                // 检测到循环

  // 510
  NOT_EXTENDED = 2900;                 // 未扩展

  // 511
  NETWORK_AUTHENTICATION_REQUIRED = 3000; // 需要网络认证


  // 非标准状态码

  // 598
  NETWORK_READ_TIMEOUT_ERROR = 3100;   // 网络读取超时

  // 599
  NETWORK_CONNECT_TIMEOUT_ERROR = 3200; // 网络连接超时
}
