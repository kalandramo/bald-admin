version: v2
# proto 源收在 protos/ 子目录（module 边界，与 go-wind-admin 分层对齐）：
# api 根只放 buf 配置；import 路径相对 module root（protos/），
# 如 protos/audit/v1/audit.proto 的 import 路径仍是 audit/v1/audit.proto。
modules:
  - name: buf.build/kalandramo/go-bald-admin
    path: protos
    lint:
      use:
        - STANDARD
      except:
        - FIELD_NOT_REQUIRED
        - PACKAGE_DIRECTORY_MATCH
        - PACKAGE_NO_IMPORT_CYCLE
      disallow_comment_ignores: true
    breaking:
      use:
        - FILE
      except:
        - EXTENSION_NO_DELETE
        - FIELD_SAME_DEFAULT
deps:
  - buf.build/googleapis/googleapis
  # --- 源 go-wind-admin proto 的依赖（复刻契约所需，2026-09-20 引入）---
  # 逐项实测确认（探针：无 dep 时 lint 报 `imported file does not exist`）：
  # - gnostic/gnostic：提供 gnostic/openapi/v3/*.proto（OpenAPI 元数据注解，
  #   源 proto 54 处 import）；本项目 openapi 生成链路本就用 gnostic 的
  #   protoc-gen-openapi 插件，此前缺的是 proto 侧注解依赖。
  # - tx7do/pagination：提供 pagination/v1/pagination.proto（源 List 入参
  #   PagingRequest，源 proto 55 处 import）。
  #
  # 注：google/protobuf/field_mask.proto **不需要** dep——它是 protobuf
  # 内置 well-known type（buf 自带 wellknowntypes 缓存），实测仅靠
  # googleapis dep 即可解析（源 proto 28 处 import 的 field_mask 均属此列）。
  - buf.build/gnostic/gnostic
  - buf.build/tx7do/pagination
