version: v2
# proto 源收在 protos/ 子目录（module 边界）：
# api 根只放 buf 配置；import 路径相对 module root（protos/），
# 如 protos/audit/v1/audit.proto 的 import 路径仍是 audit/v1/audit.proto。
modules:
  - name: buf.build/kalandramo/go-bald-admin
    path: protos
    lint:
      use:
        - STANDARD
      except:
        - FIELD_NOT_REQUIRED
        - PACKAGE_DIRECTORY_MATCH
        - PACKAGE_NO_IMPORT_CYCLE
      disallow_comment_ignores: true
    breaking:
      use:
        - FILE
      except:
        - EXTENSION_NO_DELETE
        - FIELD_SAME_DEFAULT
deps:
  - buf.build/googleapis/googleapis
  # - gnostic/gnostic：提供 gnostic/openapi/v3/*.proto（OpenAPI 元数据注解），
  #   供 OpenAPI 生成链路在 proto 侧解析注解。
  # - kalandramo/bald-bconf：提供 bald/store/v1/store.proto（分页/过滤/排序契约），
  #   即 bald.store.v1.PagingRequest。proto 里 import 该路径即可复用框架分页类型。
  #
  # 注：google/protobuf/field_mask.proto **不需要** dep——它是 protobuf
  # 内置 well-known type（buf 自带 wellknowntypes 缓存），仅靠 googleapis
  # dep 即可解析。
  - buf.build/gnostic/gnostic
  - buf.build/kalandramo/bald-bconf
  # protovalidate：声明式字段校验规则（buf.validate 注解）的 proto 定义。
  # 只引入 **proto 定义**（供注解编译期解析）；Go 运行时库 protovalidate-go
  # 由业务 module 按需 `go get buf.build/go/protovalidate`——框架核心刻意
  # 不依赖它，避免 cel-go 进入核心 go.mod。
  # 引入后 buf.gen.yaml 的 disable 必须同步加豁免（否则生成本地副本 → 运行时 panic）。
  - buf.build/bufbuild/protovalidate
