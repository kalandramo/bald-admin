syntax = "proto3";

package go.bald.admin.identity.v1;

option go_package = "github.com/kalandramo/bald-admin/api/gen/go/identity/v1;identityv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// OrgUnitService 组织单元管理（Wave P0.5，自 go-wind-admin identity 域
// org_unit.proto 精简移植，源 7 rpc：List/Count/Get/Create/Update/Delete/BatchCreate）。
//
// 本实现**对齐项目既有惯例**（与 dict/menu/tenant 一致），与源有多处显式偏差：
//
//  1. **主键用 string 业务键**（`code`，如 "FIN-LEADER-001"）而非源 `uint32 id`
//     ——源 ID 由 DB 自增生成；本项目 model.OrgUnit 主键即 `"<tenant>:<code>"`
//     （见 internal/apiserver/model/org.go），code 是跨系统同步的稳定标识。
//     proto 的 `id` 字段保留为**只读输出**（完整主键），供前端判断编辑态。
//  2. **请求体简化**：源的 `oneof query_by` / `FieldMask view_mask` /
//     `update_mask` / `allow_missing` 未移植——本项目 handler 用「非空字段即更新」
//     语义，并用 `*_set` 显式位区分「未设置」与「设为零值」（见 UpdateOrgUnitRequest）。
//  3. **枚举加前缀 + 补 0 值**：源 `Status{OFF=0,ON=1}` 的 0 值语义为「禁用」，
//     但 proto3 的 0 值必须是默认值——本实现改 `STATUS_UNSPECIFIED=0`（同 menu/tenant）。
//  4. **`parent_id` 语义统一为「父节点 code」**：源 model 存完整主键、对外暴露
//     也是完整主键（输入 code 输出主键，语义不对称）；本实现输入输出统一为 code。
//  5. **不移植源的分页**：源 List 用 `pagination.PagingRequest`；本实现精简为全量
//     （同 menu.proto 的 ListMenusRequest），分页列入后续迭代。
//  6. **不移植** gnostic 注解 / `attributes` map / `business_scopes` /
//     `permission_tags` / 法务与地理字段（源 40 字段 → 本实现 14 字段）：
//     以本项目 model.OrgUnit 的实际字段集为准（用户要求「对齐本项目字段」）。
service OrgUnitService {
  // ListOrgUnits 列出组织单元（**返回树形**，children 递归嵌套）。
  //   REST: GET /v1/org-units
  rpc ListOrgUnits(ListOrgUnitsRequest) returns (ListOrgUnitsResponse) {
    option (google.api.http) = {
      get: "/v1/org-units"
    };
  }

  // CountOrgUnits 统计组织单元数量。
  //   REST: GET /v1/org-units/count
  // 注意：REST 路径 `/org-units/count` 必须注册在 `/org-units/{code}` **之前**
  // （gin 路由树对静态段优先，显式排序避免歧义——同 dict/language 的 /count 约定）。
  rpc CountOrgUnits(CountOrgUnitsRequest) returns (CountOrgUnitsResponse) {
    option (google.api.http) = {
      get: "/v1/org-units/count"
    };
  }

  // GetOrgUnit 取单个组织单元（按 code）。
  //   REST: GET /v1/org-units/{code}
  rpc GetOrgUnit(GetOrgUnitRequest) returns (GetOrgUnitResponse) {
    option (google.api.http) = {
      get: "/v1/org-units/{code}"
    };
  }

  // CreateOrgUnit 创建组织单元（code 为业务键，重复 → 409）。
  //   REST: POST /v1/org-units
  rpc CreateOrgUnit(CreateOrgUnitRequest) returns (CreateOrgUnitResponse) {
    option (google.api.http) = {
      post: "/v1/org-units"
      body: "*"
    };
  }

  // UpdateOrgUnit 更新组织单元（非空字段即更新；code 不可变）。
  // **防环**：不能把节点挂到自己的子孙下（源无此校验，是本项目的正确性增强）。
  //   REST: PUT /v1/org-units/{code}
  rpc UpdateOrgUnit(UpdateOrgUnitRequest) returns (UpdateOrgUnitResponse) {
    option (google.api.http) = {
      put: "/v1/org-units/{code}"
      body: "*"
    };
  }

  // DeleteOrgUnit 删除组织单元。**有子节点时拒绝**（否则产生悬挂引用）。
  //   REST: DELETE /v1/org-units/{code}
  rpc DeleteOrgUnit(DeleteOrgUnitRequest) returns (DeleteOrgUnitResponse) {
    option (google.api.http) = {
      delete: "/v1/org-units/{code}"
    };
  }

  // BatchCreateOrgUnits 批量创建（逐条创建，**部分失败不回滚**——对齐源语义）。
  //   REST: POST /v1/org-units/batch
  rpc BatchCreateOrgUnits(BatchCreateOrgUnitsRequest) returns (BatchCreateOrgUnitsResponse) {
    option (google.api.http) = {
      post: "/v1/org-units/batch"
      body: "*"
    };
  }
}

// OrgUnit 组织单元。树形由 `parent_id` + `children` 表达。
message OrgUnit {
  enum Status {
    STATUS_UNSPECIFIED = 0; // 未指定
    STATUS_ON = 1;          // 启用（源 Status.ON）
    STATUS_OFF = 2;         // 禁用（源 Status.OFF）
  }

  enum Type {
    TYPE_UNSPECIFIED = 0;  // 未指定
    TYPE_COMPANY = 1;      // 公司（源 COMPANY）
    TYPE_DIVISION = 2;     // 分部（源 DIVISION）
    TYPE_DEPARTMENT = 3;   // 部门（源 DEPARTMENT）
    TYPE_TEAM = 4;         // 团队（源 TEAM）
    TYPE_PROJECT = 5;      // 项目（源 PROJECT）
    TYPE_COMMITTEE = 6;    // 委员会（源 COMMITTEE）
    TYPE_REGION = 7;       // 区域（源 REGION）
    TYPE_SUBSIDIARY = 8;   // 子公司（源 SUBSIDIARY）
    TYPE_BRANCH = 9;       // 分支机构（源 BRANCH）
    TYPE_OTHER = 100;      // 其他（源 OTHER）
  }

  string id = 1;        // 完整主键 "<tenant>:<code>"（**只读**，供前端判断编辑态）
  string code = 2;      // 唯一编码（业务键，源 code；如 "FIN-LEADER-001"）
  string name = 3;      // 组织单元名称
  Type type = 4;        // 组织类型
  string parent_id = 5; // 父节点 **code**（空 = 根节点）
  string path = 6;      // 物化路径（如 "/1/3/7"，供子树查询；由服务端推导）
  Status status = 7;    // 状态
  int32 sort_order = 8; // 排序（值越小越靠前）
  string leader_id = 9;    // 负责人用户 ID
  string leader_name = 10; // 负责人用户名称（**回填**，非持久化）
  string remark = 11;      // 备注
  string description = 12; // 描述信息

  repeated OrgUnit children = 13; // 子节点（ListOrgUnits 树形态填充）

  google.protobuf.Timestamp created_at = 100; // 创建时间
  google.protobuf.Timestamp updated_at = 101; // 更新时间
}

message ListOrgUnitsRequest {
  // 精简为全量树；源项目支持 pagination + treeTravel 开关，列入后续迭代。
}

message ListOrgUnitsResponse {
  repeated OrgUnit items = 1; // 树根数组（children 递归嵌套）
  // 全部节点数（含子孙，非根数）；uint32 避免 proto3 JSON int64 字符串化。
  uint32 total = 2;
}

message CountOrgUnitsRequest {}

message CountOrgUnitsResponse {
  uint32 total = 1;
}

message GetOrgUnitRequest {
  string code = 1; // 组织单元编码
}

message GetOrgUnitResponse {
  OrgUnit org_unit = 1;
}

message CreateOrgUnitRequest {
  string code = 1;      // 唯一编码（业务键）
  string name = 2;      // 名称
  OrgUnit.Type type = 3;
  string parent_id = 4; // 父节点 code（空 = 根）
  OrgUnit.Status status = 5; // UNSPECIFIED → 服务端默认 STATUS_ON
  int32 sort_order = 6;
  string leader_id = 7;
  string remark = 8;
  string description = 9;
}

message CreateOrgUnitResponse {
  OrgUnit org_unit = 1;
}

message UpdateOrgUnitRequest {
  string code = 1;      // 组织单元编码（路径参数，定位）
  string name = 2;      // 空 = 不改
  OrgUnit.Type type = 3;   // UNSPECIFIED = 不改
  string parent_id = 4;    // 空 = 不改（变更时做防环校验）
  OrgUnit.Status status = 5; // UNSPECIFIED = 不改
  int32 sort_order = 6;    // 见 sort_order_set
  bool sort_order_set = 7; // true 时才改 sort_order（int32 零值 0 是合法序号）
  string leader_id = 8;    // 空 = 不改
  string remark = 9;       // 空 = 不改
  string description = 10; // 空 = 不改
}

message UpdateOrgUnitResponse {
  OrgUnit org_unit = 1;
}

message DeleteOrgUnitRequest {
  string code = 1; // 组织单元编码
}

message DeleteOrgUnitResponse {
  string deleted = 1; // 被删除的组织单元编码
}

message BatchCreateOrgUnitsRequest {
  repeated OrgUnit items = 1;
}

message BatchCreateOrgUnitsResponse {
  repeated string created = 1; // 创建成功的组织单元 code 列表
  repeated string failed = 2;  // 创建失败的 code 列表（部分失败不回滚）
}
